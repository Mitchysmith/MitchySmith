<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitch's Dashboard</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/nav.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/tasks.css" />
  <link rel="stylesheet" href="styles/calendar.css" />
  <link rel="stylesheet" href="styles/finance.css" />
  <link rel="stylesheet" href="styles/learn.css" />
  <link rel="stylesheet" href="styles/mail.css" />
  <link rel="stylesheet" href="styles/perplexity.css" />
  <link rel="stylesheet" href="styles/work.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Microsoft Authentication Library -->
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- Left Navigation -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar">M</div>
        <div class="sidebar-title">
          <span class="name">Mitch</span>
          <span class="subtitle">Personal Dashboard</span>
        </div>
      </div>

      <ul class="nav-links">
        <li class="nav-item active" data-section="home">
          <span class="nav-icon">&#9752;</span>
          <span class="nav-label">Overview</span>
        </li>
        <li class="nav-item" data-section="tasks">
          <span class="nav-icon">&#10003;</span>
          <span class="nav-label">Tasks</span>
        </li>
        <li class="nav-item" data-section="calendar">
          <span class="nav-icon">&#128197;</span>
          <span class="nav-label">Calendar</span>
        </li>
        <li class="nav-item" data-section="finance">
          <span class="nav-icon">&#128176;</span>
          <span class="nav-label">Finance</span>
        </li>
        <li class="nav-item" data-section="learn">
          <span class="nav-icon">&#128200;</span>
          <span class="nav-label">Markets</span>
        </li>
        <li class="nav-item" data-section="mail">
          <span class="nav-icon">&#9993;</span>
          <span class="nav-label">Snail Mail</span>
          <span class="nav-badge" id="mail-nav-badge" style="display:none"></span>
        </li>
        <li class="nav-item" data-section="work">
          <span class="nav-icon">&#128188;</span>
          <span class="nav-label">Work</span>
        </li>
        <li class="nav-item perplexity-nav" data-section="perplexity">
          <span class="nav-icon">&#10024;</span>
          <span class="nav-label">Ideas</span>
        </li>
      </ul>

      <div class="sidebar-footer">
        <span class="clock" id="clock">--:--</span>
        <span class="date-label" id="date-label">--</span>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="workspace" id="workspace">

      <!-- Loading overlay -->
      <div class="loader-overlay" id="loader">
        <div class="pac-game">
          <div class="pac-arcade-row">
            <div class="pac-score-block">
              <div class="pac-player-lbl">1UP</div>
              <div class="pac-score-num" id="pac-score">00000</div>
            </div>
            <div class="pac-score-block" style="text-align:center">
              <div class="pac-player-lbl">LEVEL</div>
              <div class="pac-score-num" style="color:#fff">1</div>
            </div>
            <div class="pac-score-block" style="text-align:right">
              <div class="pac-player-lbl">HI-SCORE</div>
              <div class="pac-score-num" style="color:#fff">24680</div>
            </div>
          </div>

          <div class="pac-ready-txt">— READY! —</div>

          <div class="pac-lane">
            <div class="pac-ghost blinky"></div>
            <div class="pac-ghost pinky"></div>
            <div class="pac-ghost inky"></div>
            <div class="pacman"></div>
            <div class="dots">
              <span></span><span></span>
              <span class="power-dot"></span>
              <span></span><span></span><span></span>
              <span></span><span></span>
              <span class="power-dot"></span>
              <span></span>
            </div>
          </div>

          <div class="pac-status-row">
            <div class="pac-lives-group">
              <span class="pac-lbl">LIVES</span>
              <div class="pac-life"></div>
              <div class="pac-life"></div>
              <div class="pac-life"></div>
            </div>
            <div class="pac-insert-coin">● INSERT COIN ●</div>
          </div>

          <div class="pac-loading-text">
            <span style="--i:0">D</span><span style="--i:1">A</span><span style="--i:2">S</span><span style="--i:3">H</span><span style="--i:4">B</span><span style="--i:5">O</span><span style="--i:6">A</span><span style="--i:7">R</span><span style="--i:8">D</span>
          </div>
        </div>
      </div>

      <!-- Sections -->
      <div id="section-home"       class="section active"></div>
      <div id="section-tasks"      class="section"></div>
      <div id="section-calendar"   class="section"></div>
      <div id="section-finance"    class="section"></div>
      <div id="section-learn"       class="section"></div>
      <div id="section-mail"       class="section"></div>
      <div id="section-work"       class="section"></div>
      <div id="section-perplexity" class="section"></div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/home.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/mail.js"></script>
  <script src="js/perplexity.js"></script>
  <script src="js/work.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
