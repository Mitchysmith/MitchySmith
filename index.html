<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitch's Dashboard</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/nav.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/tasks.css" />
  <link rel="stylesheet" href="styles/calendar.css" />
  <link rel="stylesheet" href="styles/finance.css" />
  <link rel="stylesheet" href="styles/cooking.css" />
  <link rel="stylesheet" href="styles/exercise.css" />
  <link rel="stylesheet" href="styles/perplexity.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">

    <!-- Left Navigation -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar">M</div>
        <div class="sidebar-title">
          <span class="name">Mitch</span>
          <span class="subtitle">Personal Dashboard</span>
        </div>
      </div>

      <ul class="nav-links">
        <li class="nav-item active" data-section="home">
          <span class="nav-icon">&#9752;</span>
          <span class="nav-label">Overview</span>
        </li>
        <li class="nav-item" data-section="tasks">
          <span class="nav-icon">&#10003;</span>
          <span class="nav-label">Tasks</span>
        </li>
        <li class="nav-item" data-section="calendar">
          <span class="nav-icon">&#128197;</span>
          <span class="nav-label">Calendar</span>
        </li>
        <li class="nav-item" data-section="finance">
          <span class="nav-icon">&#128176;</span>
          <span class="nav-label">Finance</span>
        </li>
        <li class="nav-item" data-section="cooking">
          <span class="nav-icon">&#127859;</span>
          <span class="nav-label">Cooking</span>
        </li>
        <li class="nav-item" data-section="exercise">
          <span class="nav-icon">&#128170;</span>
          <span class="nav-label">Exercise</span>
        </li>
        <li class="nav-item perplexity-nav" data-section="perplexity">
          <span class="nav-icon">&#10024;</span>
          <span class="nav-label">Ideas</span>
        </li>
      </ul>

      <div class="sidebar-footer">
        <span class="clock" id="clock">--:--</span>
        <span class="date-label" id="date-label">--</span>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="workspace" id="workspace">

      <!-- Loading overlay -->
      <div class="loader-overlay" id="loader">
        <div class="pacman-wrap">
          <div class="pacman"></div>
          <div class="dots">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
        <p class="loader-text">Loading your dashboard…</p>
      </div>

      <!-- Sections injected by JS -->
      <div id="section-home" class="section active"></div>
      <div id="section-tasks" class="section"></div>
      <div id="section-calendar" class="section"></div>
      <div id="section-finance" class="section"></div>
      <div id="section-cooking" class="section"></div>
      <div id="section-exercise" class="section"></div>
      <div id="section-perplexity" class="section"></div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/home.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/cooking.js"></script>
  <script src="js/exercise.js"></script>
  <script src="js/perplexity.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
