<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitch's Dashboard</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/nav.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/tasks.css" />
  <link rel="stylesheet" href="styles/calendar.css" />
  <link rel="stylesheet" href="styles/finance.css" />
  <link rel="stylesheet" href="styles/learn.css" />
  <link rel="stylesheet" href="styles/mail.css" />
  <link rel="stylesheet" href="styles/perplexity.css" />
  <link rel="stylesheet" href="styles/work.css" />
  <link rel="stylesheet" href="styles/stocks.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Microsoft Authentication Library -->
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- Left Navigation -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar">M</div>
        <div class="sidebar-title">
          <span class="name">Mitch</span>
          <span class="subtitle">Personal Dashboard</span>
        </div>
      </div>

      <ul class="nav-links">
        <li class="nav-item active" data-section="home">
          <span class="nav-icon">&#9752;</span>
          <span class="nav-label">Overview</span>
        </li>
        <li class="nav-item" data-section="tasks">
          <span class="nav-icon">&#10003;</span>
          <span class="nav-label">To Do List</span>
        </li>
        <li class="nav-item" data-section="calendar">
          <span class="nav-icon">&#128197;</span>
          <span class="nav-label">Calendar</span>
        </li>
        <li class="nav-item" data-section="finance">
          <span class="nav-icon">&#128176;</span>
          <span class="nav-label">Finance</span>
        </li>
        <li class="nav-item" data-section="learn">
          <span class="nav-icon">&#128200;</span>
          <span class="nav-label">Markets</span>
        </li>
        <li class="nav-item" data-section="mail">
          <span class="nav-icon">&#9993;</span>
          <span class="nav-label">Snail Mail</span>
          <span class="nav-badge" id="mail-nav-badge" style="display:none"></span>
        </li>
        <li class="nav-item" data-section="work">
          <span class="nav-icon">&#128188;</span>
          <span class="nav-label">Work</span>
        </li>
        <li class="nav-item perplexity-nav" data-section="perplexity">
          <span class="nav-icon">&#10024;</span>
          <span class="nav-label">Ideas</span>
        </li>
        <li class="nav-item" data-section="stocks">
          <span class="nav-icon">&#128201;</span>
          <span class="nav-label">Stocks</span>
        </li>
      </ul>

      <div class="sidebar-footer">
        <span class="clock" id="clock">--:--</span>
        <span class="date-label" id="date-label">--</span>
        <span class="app-version" id="app-version"></span>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="workspace" id="workspace">

      <!-- Dev header — sticky top bar -->
      <div class="dev-header" id="dev-header">
        <div class="flask-controls">
          <span class="flask-dot" id="flask-dot"></span>
          <span class="flask-status-label" id="flask-status-label">—</span>
          <button class="flask-btn flask-btn-start" id="flask-start-btn">▶ Start Flask</button>
          <button class="flask-btn flask-btn-stop" id="flask-stop-btn">■ Stop</button>
        </div>
      </div>

      <!-- Loading overlay -->
      <div class="loader-overlay" id="loader">
        <div class="bird-scene">
          <div class="bird-title">✦ YOUR DASHBOARD ✦</div>
          <div class="bird-subtitle">Fetching your world…</div>
          <div class="bird-lane">
            <div class="bird-crumb"></div>
            <div class="bird-crumb"></div>
            <div class="bird-crumb"></div>
            <div class="bird-crumb"></div>
            <div class="bird-crumb"></div>
            <div class="bird-crumb"></div>
            <div class="bird-crumb"></div>
            <div class="bird-figure">
              <div class="bird-tail"></div>
              <div class="bird-body"></div>
              <div class="bird-breast"></div>
              <div class="bird-wing"></div>
              <div class="bird-head"></div>
              <div class="bird-eye"></div>
              <div class="bird-beak"></div>
              <div class="bird-feet">
                <div class="bird-foot fl"></div>
                <div class="bird-foot fr"></div>
              </div>
            </div>
          </div>
          <div class="bird-msg">Loading<span class="bird-dot" style="--d:0">.</span><span class="bird-dot" style="--d:1">.</span><span class="bird-dot" style="--d:2">.</span></div>
        </div>
      </div>

      <!-- Sections -->
      <div id="section-home"       class="section active"></div>
      <div id="section-tasks"      class="section"></div>
      <div id="section-calendar"   class="section"></div>
      <div id="section-finance"    class="section"></div>
      <div id="section-learn"       class="section"></div>
      <div id="section-mail"       class="section"></div>
      <div id="section-work"       class="section"></div>
      <div id="section-perplexity" class="section"></div>
      <div id="section-stocks"    class="section"></div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/home.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/mail.js"></script>
  <script src="js/perplexity.js"></script>
  <script src="js/work.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/stocks.js"></script>
  <script src="js/devtools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
